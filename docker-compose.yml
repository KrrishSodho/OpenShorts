services:
  openshort:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openshort-studio
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SELECTED_GEMINI_MODEL=gemini-3.8-flash
    volumes:
      - ./storage:/app/storage
      - ./.env:/app/.env
