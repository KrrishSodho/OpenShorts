<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Starting Viral Studio...</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #07090E;
      color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid rgba(0, 245, 255, 0.25);
      border-radius: 12px;
      -webkit-app-region: drag;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .logo-badge {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      background: linear-gradient(135deg, #091E3A 0%, #060D1A 100%);
      border: 1.5px solid #00F5FF;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 32px rgba(0, 245, 255, 0.35);
      animation: pulse 2.2s infinite ease-in-out;
    }
    .logo-badge svg {
      width: 36px;
      height: 36px;
      fill: none;
      stroke: #00F5FF;
      stroke-width: 2.2;
    }
    .title-block {
      text-align: center;
    }
    .app-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #FFFFFF;
      text-transform: uppercase;
    }
    .app-sub {
      font-size: 11px;
      color: #94A3B8;
      font-family: monospace;
      margin-top: 4px;
      letter-spacing: 1px;
    }
    .status-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }
    .progress-bar-wrap {
      width: 220px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar-indeterminate {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      background: #00F5FF;
      box-shadow: 0 0 10px #00F5FF;
      width: 45%;
      border-radius: 2px;
      animation: sweep 1.5s infinite ease-in-out;
    }
    .status-text {
      font-size: 11px;
      color: #00F5FF;
      font-family: monospace;
      letter-spacing: 0.5px;
    }
    @keyframes sweep {
      0% { left: -45%; }
      50% { left: 40%; width: 55%; }
      100% { left: 105%; }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 24px rgba(0, 245, 255, 0.25); }
      50% { transform: scale(1.04); box-shadow: 0 0 40px rgba(0, 245, 255, 0.45); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-badge">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
        <polyline points="2 17 12 22 22 17"></polyline>
        <polyline points="2 12 12 17 22 12"></polyline>
      </svg>
    </div>
    <div class="title-block">
      <div class="app-title">Viral Studio Pro</div>
      <div class="app-sub">STANDALONE DESKTOP WORKSTATION v4.2</div>
    </div>
    <div class="status-block">
      <div class="progress-bar-wrap">
        <div class="progress-bar-indeterminate"></div>
      </div>
      <div id="statusText" class="status-text">Starting AI Engine & Local Services...</div>
    </div>
  </div>
  <script>
    if (window.electronAPI && window.electronAPI.onStatusUpdate) {
      window.electronAPI.onStatusUpdate((msg) => {
        const el = document.getElementById('statusText');
        if (el && msg) el.innerText = msg;
      });
    }
  </script>
</body>
</html>
